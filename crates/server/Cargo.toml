[package]
name = "atlasio-server"
version = "0.1.1"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
atlasio-domain = { path = "../domain" }
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
data-encoding = "2"
hmac = "0.12"
object_store = { version = "0.14.2", features = ["aws"] }
qrcode = "0.14"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1", features = ["serde", "v4"] }
